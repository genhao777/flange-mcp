  aside { padding: 22px 20px; background: linear-gradient(180deg, rgba(18,26,33,.92), rgba(10,15,20,.94)); border-left: 1px solid var(--line); color: var(--text); box-shadow:-18px 0 45px rgba(0,0,0,.22); backdrop-filter: blur(16px); }

  .section { padding: 15px 0 17px; border-top:1px solid rgba(107,126,137,.18); }
  .label { margin-top: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; font-size: 10px; }
  .value { margin-top: 7px; font-size: 13px; line-height: 1.65; color:#d9e3e7; }
  #selection { color: var(--accent); min-height: 22px; }
  .hint { margin-top: 18px; padding: 12px 13px; border:1px solid rgba(107,126,137,.2); border-radius: 8px; background: rgba(12,18,23,.68); color: #a9b9c0; font-size: 12px; line-height: 1.65; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .control-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:7px; margin-top:8px; }
  .control-grid button { width:100%; }
  .component-list { display:grid; gap:6px; margin-top:8px; }
  .component-row { display:flex; align-items:center; gap:8px; color:#d9e3e7; font-size:12px; padding:5px 7px; border:1px solid rgba(119,145,157,.16); border-radius:6px; background:rgba(255,255,255,.025); }

  .range-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; margin-top:9px; color:#a9b9c0; font-size:12px; }
  .range-row input { width:100%; accent-color:var(--accent); }
  @media (max-width: 860px) {
    body { display:block; position:relative; overflow:hidden; }
    #stage { width:100%; height:100%; }
    aside { position:absolute; z-index:2; top:12px; right:12px; width:min(286px, calc(100% - 24px)); max-height:calc(100% - 24px); overflow:auto; border:1px solid rgba(107,126,137,.35); border-radius:12px; padding:14px 16px; background:rgba(15,21,26,.88); backdrop-filter:blur(10px); box-shadow:-10px 12px 35px rgba(0,0,0,.28); }

  const shadowCy = Math.min(h * 0.84, shadowBounds.max[1] + Math.max(18, (shadowBounds.max[1] - shadowBounds.min[1]) * 0.10));
  ctx.save();
  ctx.translate(shadowCx, shadowCy);
  ctx.scale(Math.max(1, (shadowBounds.max[0] - shadowBounds.min[0]) / 210), 0.18);
  ctx.beginPath(); ctx.ellipse(0, 0, 105, 30, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.shadowColor = 'rgba(0,0,0,.58)'; ctx.shadowBlur = 24; ctx.fill();
  ctx.restore();
  const halo = ctx.createRadialGradient(shadowCx, shadowCy - h * 0.26, 8, shadowCx, shadowCy - h * 0.26, Math.max(w, h) * 0.46);
  halo.addColorStop(0, 'rgba(112,166,187,.12)'); halo.addColorStop(0.5, 'rgba(45,91,108,.045)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, w, h);
  const order = [];
  projectedGroups.forEach(({group, projected}) => { if (!group.visible) return; group.triangles.forEach((tri, index) => order.push({ group, projected, tri, index, depth: (projected[tri[0]].depth + projected[tri[1]].depth + projected[tri[2]].depth) / 3 })); });
  order.sort((a,b) => a.depth - b.depth);
  for (const item of order) {
    const [i0,i1,i2] = item.tri;
    const poly = [item.projected[i0], item.projected[i1], item.projected[i2]];
    ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y); ctx.lineTo(poly[1].x, poly[1].y); ctx.lineTo(poly[2].x, poly[2].y); ctx.closePath();
    const isSelected = selected && selected.groupIndex === item.group.index && selected.triangleIndex === item.index;
    const base = materialColor(item.group);
    ctx.fillStyle = isSelected ? '#f7be72' : `rgb(${shade(item.group.vertices[i0], item.group.vertices[i1], item.group.vertices[i2], base, item.depth).join(',')})`;
    ctx.fill();
    ctx.strokeStyle = isSelected ? 'rgba(255,231,183,.94)' : 'rgba(5,12,17,.20)';
    ctx.lineWidth = isSelected ? 1.25 : 0.35;
    ctx.stroke();
  }
  const vignette = ctx.createRadialGradient(w/2, h*.44, Math.min(w,h)*.22, w/2, h*.48, Math.max(w,h)*.72);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(0.72, 'rgba(0,0,0,.055)'); vignette.addColorStop(1, 'rgba(0,0,0,.30)');
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, w, h);
  explodeValue.textContent = `查看间距 ${Math.round(explode * 100)}%`;
  updateRotation();
}
function animate() {
  if (!autoRotate) { animationFrame = 0; return; }
  rotY += 0.006;
  render();
  animationFrame = requestAnimationFrame(animate);
}
function inside(p, a, b, c) {
  const d = (b.y-c.y)*(a.x-c.x) + (c.x-b.x)*(a.y-c.y);
  if (Math.abs(d) < 1e-8) return false;
  const u = ((b.y-c.y)*(p.x-c.x) + (c.x-b.x)*(p.y-c.y)) / d;
  const v = ((c.y-a.y)*(p.x-c.x) + (a.x-c.x)*(p.y-c.y)) / d;
  return u >= 0 && v >= 0 && u + v <= 1;
}
function pick(x, y) {
  const projectedGroups = projectAll(); let best = null, depth = -Infinity;
  projectedGroups.forEach(({group, projected}) => { if (!group.visible) return; group.triangles.forEach((tri, index) => { const poly = tri.map(i => projected[i]); if (inside({x,y}, poly[0], poly[1], poly[2])) { const d = poly.reduce((s,v) => s+v.depth, 0); if (d > depth) { depth = d; best = {groupIndex: group.index, triangleIndex: index}; } } }); });
  selected = best;
  selection.textContent = best ? `已选中 ${groupData[best.groupIndex].name} · 面片 ${best.triangleIndex + 1}` : '未选中面片';
  render();
}
if (groupData.length > 1) {
  document.getElementById('assembly-controls').hidden = false;
  const list = document.getElementById('component-list');
  groupData.forEach(group => {
    const row = document.createElement('label');
    row.className = 'component-row';
    const swatch = materialColor(group);
    row.innerHTML = `<input type="checkbox" checked data-group="${group.index}"><span class="component-swatch" style="background:rgb(${swatch.join(',')})"></span><span>${group.name}</span>`;
    row.querySelector('input').addEventListener('change', e => { group.visible = e.target.checked; render(); });
    list.appendChild(row);
  });
}
explodeSlider.addEventListener('input', e => { explode = Number(e.target.value); render(); });
canvas.addEventListener('pointerdown', e => { dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY; canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!dragging) return; const dx=e.clientX-lastX, dy=e.clientY-lastY; if (Math.abs(dx)+Math.abs(dy)>2) moved=true; if (e.shiftKey) { rotZ += dx*0.009; } else { rotY += dx*0.009; rotX = Math.max(-Math.PI, Math.min(Math.PI, rotX + dy*0.009)); } lastX=e.clientX; lastY=e.clientY; render(); });
canvas.addEventListener('pointerup', e => { dragging=false; canvas.classList.remove('dragging'); if (!moved) pick(e.offsetX, e.offsetY); });
canvas.addEventListener('pointercancel', () => { dragging=false; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(0.55, Math.min(3.5, zoom * (e.deltaY < 0 ? 1.08 : 0.92))); render(); }, {passive:false});
document.getElementById('reset').addEventListener('click', () => { rotX=0.62; rotY=-0.72; rotZ=0; zoom=0.94; explode=0; explodeSlider.value='0'; selected=null; selection.textContent='未选中面片'; render(); });
document.getElementById('front').addEventListener('click', () => { rotX=Math.PI/2; rotY=0; rotZ=0; render(); });
document.getElementById('top').addEventListener('click', () => { rotX=0; rotY=0; rotZ=0; render(); });
document.getElementById('right').addEventListener('click', () => { rotX=Math.PI/2; rotY=Math.PI/2; rotZ=0; render(); });
document.getElementById('auto').addEventListener('click', e => {
  autoRotate = !autoRotate;
  e.target.textContent = autoRotate ? '停止旋转' : '自动旋转';
  if (autoRotate && !animationFrame) animationFrame = requestAnimationFrame(animate);
  if (!autoRotate && animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = 0; }
  render();
});
window.addEventListener('resize', render);
render();
</script>
</body>
